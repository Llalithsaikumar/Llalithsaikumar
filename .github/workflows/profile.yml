name: Refresh profile

# Rebuilds the Selected Work cards from whatever is currently *pinned* on the
# profile, and regenerates the self-hosted stats/language SVGs.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pinned cards + stat SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/build_profile.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg assets/langs.svg
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile [skip ci]"
            git push
          fi
